  <text x="96" y="268" font-family="Inter Tight, Inter, sans-serif" font-size="62" font-weight="400" letter-spacing="-1.3" fill="#0c0a09">Считайте <tspan fill="#3398e1">деньги каналов</tspan>,</text>
