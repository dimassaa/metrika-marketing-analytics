<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-labelledby="og-title">
  <title id="og-title">Метрика — считайте деньги каналов, а не клики</title>
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- Brand row: spark mark + wordmark -->
  <g transform="translate(96 88)">
    <path d="M20 0c1.75 7.75 7.25 13.25 15 15-7.75 1.75-13.25 7.25-15 15C18.25 22.25 12.75 16.75 5 15 12.75 13.25 18.25 7.75 20 0Z" stroke="#0c0a09" stroke-width="1.75" stroke-linejoin="round"/>
    <circle cx="20" cy="15" r="3" stroke="#0c0a09" stroke-width="1.75"/>
    <text x="52" y="21" font-family="Inter Tight, Inter, sans-serif" font-size="24" font-weight="500" fill="#0c0a09">Метрика</text>
