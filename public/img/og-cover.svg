  <text x="96" y="486" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#78716c">CAC, LTV и ROMI по каналам — на данных интернет-магазина кофе «Зёрна»</text>
  <text x="96" y="540" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#a8a29e">Демонстрационные данные</text>
